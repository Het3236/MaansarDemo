<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maansar Studios — redirecting</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var base = "/MaansarDemo/"
        var p = window.location.pathname
        if (p.indexOf(base) === 0) {
          var m = p.slice(base.length).match(/^(v1|v3|v4)\/(.*)$/)
          if (m && m[2]) {
            var q = window.location.search
            window.location.replace(
              base + m[1] + '/?/' + m[2].replace(/&/g, '~and~') +
                (q ? '&' + q.slice(1).replace(/&/g, '~and~') : '') +
                window.location.hash,
            )
            return
          }
        }
        window.location.replace(base)
      })()
    </script>
  </head>
  <body>
    <noscript><a href="/MaansarDemo/">Maansar Studios — website versions</a></noscript>
  </body>
</html>
