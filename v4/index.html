<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />

    <title>Maansar Studios — Interior design and build</title>
    <meta
      name="description"
      content="Maansar Studios designs and builds home interiors in Gujarat — full homes, sample houses and single rooms, from the first measured drawing to the last handle."
    />
    <link rel="canonical" href="https://maansarstudios.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maansar Studios" />
    <meta property="og:title" content="Maansar Studios — Interior design and build" />
    <meta property="og:description" content="Homes designed around the people who live in them." />
    <meta property="og:url" content="https://maansarstudios.com/" />
    <meta property="og:image" content="https://maansarstudios.com/media/img/hero-living-terracotta-1600.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/media/brand/logo-mark-256.png" />
    <link rel="apple-touch-icon" href="/media/brand/logo-mark-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@300;400;500&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "InteriorDesigner",
        "name": "Maansar Studios",
        "url": "https://maansarstudios.com/",
        "sameAs": ["https://www.instagram.com/maansarstudios/"],
        "areaServed": "Gujarat, India"
      }
    </script>
    <!-- Hides the page until the loader has mounted, so there is no flash of the
         undrawn hero. main.js removes the class; the noscript rule undoes it. -->
    <script>document.documentElement.classList.add('js')</script>
    <noscript><style>.js body { visibility: visible !important; }</style></noscript>
  </head>
  <body>
    <a class="skip" href="#contact">Skip to contact</a>

    <!-- Everything fixed lives outside the smooth-scroll wrapper: ScrollSmoother
         transforms #smooth-content, and a transformed ancestor breaks `position: fixed`. -->
    <div class="loader" id="loader" aria-hidden="true"></div>
    <header class="nav" id="nav"></header>
    <div class="progress" aria-hidden="true"><span></span></div>
    <div class="menu" id="menu" hidden></div>

    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main id="main"></main>
        <footer class="footer" id="footer"></footer>
      </div>
    </div>

    <div class="project" id="project" role="dialog" aria-modal="true" aria-labelledby="project-title" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
